<!DOCTYPE html>
<html>
  <head>
    <title>AR Hóa Học - Oxide Chu kỳ 3</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-marker preset="hiro">
        
        <a-entity position="-1 0 0">
            <a-cylinder color="white" opacity="0.3" radius="0.3" height="0.8"></a-cylinder>
            <a-cylinder id="liquid-na" color="white" radius="0.28" height="0.4" position="0 -0.15 0"></a-cylinder>
            <a-text value="Na2O" position="-0.2 -0.6 0" rotation="-90 0 0" color="black" width="3"></a-text>
            <a-text value="NaOH (pH 13)" position="-0.4 0.6 0" rotation="-90 0 0" color="blue" width="2"></a-text>
        </a-entity>

        <a-entity position="0 0 0">
            <a-cylinder color="white" opacity="0.3" radius="0.3" height="0.8"></a-cylinder>
            <a-cylinder id="liquid-mg" color="white" radius="0.28" height="0.4" position="0 -0.15 0"></a-cylinder>
            <a-text value="MgO" position="-0.2 -0.6 0" rotation="-90 0 0" color="black" width="3"></a-text>
            <a-text value="Mg(OH)2 (pH 9)" position="-0.4 0.6 0" rotation="-90 0 0" color="cyan" width="2"></a-text>
        </a-entity>

        <a-entity position="1 0 0">
            <a-cylinder color="white" opacity="0.3" radius="0.3" height="0.8"></a-cylinder>
            <a-cylinder id="liquid-p" color="white" radius="0.28" height="0.4" position="0 -0.15 0"></a-cylinder>
            <a-text value="P2O5" position="-0.2 -0.6 0" rotation="-90 0 0" color="black" width="3"></a-text>
            <a-text value="H3PO4 (pH 2)" position="-0.4 0.6 0" rotation="-90 0 0" color="red" width="2"></a-text>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Logic đơn giản để đổi màu khi chạm (giả lập phản ứng)
      window.addEventListener('click', function () {
          document.querySelector('#liquid-na').setAttribute('color', '#0000FF'); // Xanh dương
          document.querySelector('#liquid-mg').setAttribute('color', '#ADD8E6'); // Xanh nhạt
          document.querySelector('#liquid-p').setAttribute('color', '#FF0000');  // Đỏ
      });
    </script>
  </body>
</html>
