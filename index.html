<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Thí nghiệm AR – Không Marker</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, sans-serif;
}

/* Camera nền */
#camera {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
}

/* Unity */
#unity-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

#unity-canvas {
  width: 100%;
  height: 100%;
  background: transparent;
}

/* Nút điều khiển */
#controls {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
}

button {
  padding: 10px 14px;
  font-size: 14px;
  border: none;
  border-radius: 8px;
  background: rgba(0,0,0,0.6);
  color: white;
}
</style>
</head>

<body>

<!-- Camera -->
<video id="camera" autoplay playsinline muted></video>

<!-- Unity -->
<div id="unity-container">
  <canvas id="unity-canvas"></canvas>
</div>

<!-- Nút -->
<div id="controls">
  <button onclick="toggleCamera()">📷 Camera</button>
  <button onclick="toggleFullscreen()">⛶ Full</button>
</div>

<script src="Build/web build.loader.js"></script>

<script>
/* ================= CAMERA ================= */
let camStream = null;
let camOn = true;

async function startCamera() {
  camStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });
  document.getElementById("camera").srcObject = camStream;
}

function stopCamera() {
  if (camStream) {
    camStream.getTracks().forEach(t => t.stop());
    camStream = null;
  }
}

function toggleCamera() {
  camOn ? stopCamera() : startCamera();
  camOn = !camOn;
}

/* ================= FULLSCREEN ================= */
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

/* ================= UNITY ================= */
createUnityInstance(document.querySelector("#unity-canvas"), {
  dataUrl: "Build/web build.data.unityweb",
  frameworkUrl: "Build/web build.framework.js.unityweb",
  codeUrl: "Build/web build.wasm.unityweb",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "AR",
  productName: "ThiNghiemVatLy",
  productVersion: "1.0"
});

/* Khởi động camera */
startCamera();
</script>

</body>
</html>
