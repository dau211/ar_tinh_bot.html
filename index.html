<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Thí Nghiệm AR: Oxide Chu Kỳ 3 - Pro Lab</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      .ui-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 20px;
        z-index: 1000;
      }
      button {
        padding: 15px 25px;
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        background: rgba(44, 62, 80, 0.9);
        color: #ecf0f1;
        border: 2px solid #34495e;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      }
      button:hover { background: #34495e; transform: scale(1.05); }
      button:disabled { background: #95a5a6; cursor: not-allowed; opacity: 0.6; }
      #status-text {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.9);
        color: #2c3e50;
        padding: 15px 30px;
        border-radius: 30px;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: bold;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        z-index: 1000;
        text-align: center;
        min-width: 300px;
      }
    </style>
  </head>
  <body style="margin: 0px; overflow: hidden;">
    <div id="status-text">Hướng camera vào Marker Hiro để chuẩn bị dụng cụ</div>
    
    <div class="ui-container">
      <button id="btn-oxide" onclick="stepAddOxide()">Bước 1: Lấy hóa chất</button>
      <button id="btn-litmus" onclick="stepAddLitmus()" disabled>Bước 2: Thử quỳ tím</button>
      <button onclick="resetLab()">Làm lại</button>
    </div>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; logarithmicDepthBuffer: true;">
      
      <a-marker preset="hiro">
        <!-- Bàn thí nghiệm gỗ -->
        <a-box position="0 -0.15 0" width="4.5" height="0.1" depth="3" color="#5D4037"></a-box>

        <!-- CHIẾC THÌA (SPOON) - Nâng cấp hình dáng thực tế -->
        <a-entity id="spoon-group" position="0 1.5 0.5" visible="false">
            <!-- Cán thìa kim loại -->
            <a-cylinder position="0.3 0 0" radius="0.01" height="0.7" color="#BDBDBD" rotation="0 0 90"></a-cylinder>
            <!-- Lòng thìa hơi trũng -->
            <a-entity position="-0.08 0 0">
                <a-sphere radius="0.1" color="#E0E0E0" scale="1.4 0.3 1" clip-side="back"></a-sphere>
                <!-- Bột bám trên thìa khi xúc -->
                <a-sphere id="spoon-powder" position="0 0.04 0" radius="0.06" color="white" visible="false"></a-sphere>
            </a-entity>
        </a-entity>

        <!-- DÃY ĐĨA ĐỰNG HÓA CHẤT -->
        <a-entity position="0 0 -0.8">
            <!-- Đĩa Na2O -->
            <a-entity position="-1.2 0 0">
                <a-cylinder radius="0.3" height="0.02" color="#ECEFF1"></a-cylinder>
                <a-cone id="powder-na" radius-bottom="0.18" height="0.12" color="#FFFFFF" position="0 0.05 0"></a-cone>
                <a-text value="Na2O" position="0 0.25 0" rotation="-90 0 0" color="#FFFFFF" align="center" width="2.5" font="mozillavr"></a-text>
            </a-entity>
            <!-- Đĩa MgO -->
            <a-entity position="0 0 0">
                <a-cylinder radius="0.3" height="0.02" color="#ECEFF1"></a-cylinder>
                <a-cone id="powder-mg" radius-bottom="0.18" height="0.12" color="#F5F5F5" position="0 0.05 0"></a-cone>
                <a-text value="MgO" position="0 0.25 0" rotation="-90 0 0" color="#FFFFFF" align="center" width="2.5" font="mozillavr"></a-text>
            </a-entity>
            <!-- Đĩa P2O5 -->
            <a-entity position="1.2 0 0">
                <a-cylinder radius="0.3" height="0.02" color="#ECEFF1"></a-cylinder>
                <a-cone id="powder-p" radius-bottom="0.18" height="0.12" color="#FAFAFA" position="0 0.05 0"></a-cone>
                <a-text value="P2O5" position="0 0.25 0" rotation="-90 0 0" color="#FFFFFF" align="center" width="2.5" font="mozillavr"></a-text>
            </a-entity>
        </a-entity>

        <!-- DÃY CỐC NƯỚC - Nâng cấp hiệu ứng chất lỏng -->
        <a-entity position="0 0 0.4">
            <!-- Cốc 1 (Na2O) -->
            <a-entity id="beaker-na" position="-1.2 0.3 0">
              <a-cylinder radius="0.32" height="0.75" color="#fff" opacity="0.1" side="double"></a-cylinder>
              <!-- Nước bên trong cốc -->
              <a-cylinder id="liquid-na" radius="0.3" height="0.45" position="0 -0.15 0" color="#81D4FA" opacity="0.6"></a-cylinder>
              <!-- Mặt nước sáng bóng -->
              <a-circle radius="0.3" position="0 0.08 0" rotation="-90 0 0" color="#E1F5FE" opacity="0.4" material="shininess: 100;"></a-circle>
              <a-text value="H2O" position="0 -0.45 0.35" rotation="-90 0 0" color="#000" align="center" width="2"></a-text>
              <a-box id="litmus-na" position="0 0.5 0" width="0.1" height="0.4" depth="0.01" color="#E1BEE7" visible="false"></a-box>
            </a-entity>

            <!-- Cốc 2 (MgO) -->
            <a-entity id="beaker-mg" position="0 0.3 0">
              <a-cylinder radius="0.32" height="0.75" color="#fff" opacity="0.1" side="double"></a-cylinder>
              <a-cylinder id="liquid-mg" radius="0.3" height="0.45" position="0 -0.15 0" color="#81D4FA" opacity="0.6"></a-cylinder>
              <a-circle radius="0.3" position="0 0.08 0" rotation="-90 0 0" color="#E1F5FE" opacity="0.4" material="shininess: 100;"></a-circle>
              <a-text value="H2O" position="0 -0.45 0.35" rotation="-90 0 0" color="#000" align="center" width="2"></a-text>
              <a-box id="litmus-mg" position="0 0.5 0" width="0.1" height="0.4" depth="0.01" color="#E1BEE7" visible="false"></a-box>
            </a-entity>

            <!-- Cốc 3 (P2O5) -->
            <a-entity id="beaker-p" position="1.2 0.3 0">
              <a-cylinder radius="0.32" height="0.75" color="#fff" opacity="0.1" side="double"></a-cylinder>
              <a-cylinder id="liquid-p" radius="0.3" height="0.45" position="0 -0.15 0" color="#81D4FA" opacity="0.6"></a-cylinder>
              <a-circle radius="0.3" position="0 0.08 0" rotation="-90 0 0" color="#E1F5FE" opacity="0.4" material="shininess: 100;"></a-circle>
              <a-text value="H2O" position="0 -0.45 0.35" rotation="-90 0 0" color="#000" align="center" width="2"></a-text>
              <a-box id="litmus-p" position="0 0.5 0" width="0.1" height="0.4" depth="0.01" color="#E1BEE7" visible="false"></a-box>
            </a-entity>
        </a-entity>

      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const status = document.getElementById('status-text');
      const spoon = document.getElementById('spoon-group');
      const powderOnSpoon = document.getElementById('spoon-powder');
      const btnOxide = document.getElementById('btn-oxide');
      const btnLitmus = document.getElementById('btn-litmus');
      
      async function stepAddOxide() {
        btnOxide.disabled = true;
        spoon.setAttribute('visible', 'true');
        
        const offsets = [-1.2, 0, 1.2];
        const liquidIds = ['liquid-na', 'liquid-mg', 'liquid-p'];
        const powderIds = ['powder-na', 'powder-mg', 'powder-p'];

        for(let i=0; i < 3; i++) {
            status.innerText = "Đang lấy hóa chất từ đĩa " + (i+1) + "...";
            // Di chuyển thìa nghiêng nhẹ để xúc
            spoon.setAttribute('animation', `property: position; to: ${offsets[i]} 0.2 -0.8; dur: 1000; easing: easeInOutQuad`);
            spoon.setAttribute('animation__rot', `property: rotation; to: 10 0 0; dur: 500; easing: easeInOutQuad`);
            await new Promise(r => setTimeout(r, 1100));
            
            powderOnSpoon.setAttribute('visible', 'true');
            document.getElementById(powderIds[i]).setAttribute('visible', 'false');
            
            status.innerText = "Đang đổ hóa chất vào cốc...";
            // Di chuyển thìa tới trên cốc
            spoon.setAttribute('animation', `property: position; to: ${offsets[i]} 0.8 0.4; dur: 1000; easing: easeInOutQuad`);
            spoon.setAttribute('animation__rot', `property: rotation; to: 0 0 0; dur: 500; easing: easeInOutQuad`);
            await new Promise(r => setTimeout(r, 1100));
            
            // Hiệu ứng đổ: Xoay mạnh và gõ nhẹ
            spoon.setAttribute('animation', `property: rotation; to: 0 0 45; dur: 400; easing: easeInBack`);
            await new Promise(r => setTimeout(r, 450));
            
            powderOnSpoon.setAttribute('visible', 'false');
            
            // Đổi màu nước sau khi đổ
            document.getElementById(liquidIds[i]).setAttribute('animation', 'property: opacity; to: 0.8; dur: 1000');
            
            if(i === 0) status.innerText = "Na2O tan: Dung dịch kiềm NaOH";
            if(i === 1) status.innerText = "MgO tan một phần: Dung dịch kiềm yếu Mg(OH)2";
            if(i === 2) status.innerText = "P2O5 tan: Dung dịch acid H3PO4";
            
            // Reset thế thìa
            spoon.setAttribute('animation', `property: rotation; to: 0 0 0; dur: 300`);
            await new Promise(r => setTimeout(r, 1200));
        }

        spoon.setAttribute('visible', 'false');
        status.innerText = "Hòa tan xong các Oxide. Hãy tiến hành thử quỳ tím.";
        btnLitmus.disabled = false;
      }

      function stepAddLitmus() {
        btnLitmus.disabled = true;
        status.innerText = "Đang tiến hành nhúng quỳ tím...";
        
        const litmusIds = ['litmus-na', 'litmus-mg', 'litmus-p'];
        const colors = ['#1A237E', '#4FC3F7', '#C62828']; 
        const labResults = [
            "NaOH: Kiềm mạnh (Quỳ hóa xanh đậm)",
            "Mg(OH)2: Kiềm yếu (Quỳ hóa xanh nhạt)",
            "H3PO4: Acid (Quỳ hóa đỏ)"
        ];

        litmusIds.forEach((id, index) => {
          const el = document.getElementById(id);
          el.setAttribute('visible', 'true');
          el.setAttribute('animation', "property: position; to: 0 0.1 0; dur: 1500; easing: easeInOutCubic");
          
          setTimeout(() => {
            el.setAttribute('color', colors[index]);
            status.innerText = labResults[index];
          }, 1600 + (index * 1200));
        });
      }

      function resetLab() {
        location.reload();
      }
    </script>
  </body>
</html>
