<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AR Chemistry Experiment - Oxides & Water</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.8);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        button {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #2c3e50;
            color: white;
            transition: all 0.3s;
        }
        button:hover { background-color: #34495e; transform: scale(1.05); }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .info-box {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            background: rgba(44, 62, 80, 0.7);
            padding: 10px 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="info-box">
        <h2 id="status-text">Hướng dẫn: Quét camera vào hình HIRO Marker</h2>
    </div>

    <div class="ui-panel">
        <button id="btn-add" onclick="stepAddChemicals()">1. Cho hóa chất vào bình</button>
        <button id="btn-test" onclick="stepTestLitmus()" disabled>2. Nhúng quỳ tím</button>
        <button id="btn-reset" onclick="resetExperiment()">Làm lại</button>
    </div>

    <a-scene embedded arjs='sourceType: webcam; debugUIEnabled: false;'>
        <a-marker preset="hiro">
            
            <!-- Hệ thống 3 trạm thí nghiệm -->
            
            <!-- TRẠM 1: Na2O -->
            <a-entity position="-1.5 0 0">
                <a-text value="Na2O" position="0 1.8 0" align="center" color="#333" width="4"></a-text>
                
                <!-- Bình tam giác (Erlenmeyer Flask) - Vẽ bằng Cone và Cylinder -->
                <a-entity id="flask-1">
                    <a-cone color="#fff" opacity="0.3" radius-bottom="0.5" radius-top="0.1" height="0.8" position="0 0.4 0"></a-cone>
                    <a-cylinder color="#fff" opacity="0.3" radius="0.1" height="0.3" position="0 0.9 0"></a-cylinder>
                    <!-- Nước trong bình -->
                    <a-cone id="liquid-1" color="#aaddff" opacity="0.6" radius-bottom="0.48" radius-top="0.2" height="0.5" position="0 0.25 0"></a-cone>
                </a-entity>

                <!-- Thìa thủy tinh và hóa chất -->
                <a-entity id="spoon-1" position="0.5 2 0" rotation="0 0 -30" visible="false">
                    <a-cylinder color="#ddd" opacity="0.5" radius="0.02" height="1" position="0 0 0"></a-cylinder>
                    <a-sphere id="powder-1" color="#ffffff" radius="0.08" position="0 -0.5 0"></a-sphere>
                </a-entity>

                <!-- Giấy quỳ tím -->
                <a-box id="litmus-1" color="#800080" width="0.15" height="0.6" depth="0.01" position="0 1.5 0" visible="false"></a-box>
            </a-entity>

            <!-- TRẠM 2: MgO -->
            <a-entity position="0 0 0">
                <a-text value="MgO" position="0 1.8 0" align="center" color="#333" width="4"></a-text>
                
                <a-entity id="flask-2">
                    <a-cone color="#fff" opacity="0.3" radius-bottom="0.5" radius-top="0.1" height="0.8" position="0 0.4 0"></a-cone>
                    <a-cylinder color="#fff" opacity="0.3" radius="0.1" height="0.3" position="0 0.9 0"></a-cylinder>
                    <a-cone id="liquid-2" color="#aaddff" opacity="0.6" radius-bottom="0.48" radius-top="0.2" height="0.5" position="0 0.25 0"></a-cone>
                </a-entity>

                <a-entity id="spoon-2" position="0.5 2 0" rotation="0 0 -30" visible="false">
                    <a-cylinder color="#ddd" opacity="0.5" radius="0.02" height="1" position="0 0 0"></a-cylinder>
                    <a-sphere id="powder-2" color="#ffffff" radius="0.08" position="0 -0.5 0"></a-sphere>
                </a-entity>

                <a-box id="litmus-2" color="#800080" width="0.15" height="0.6" depth="0.01" position="0 1.5 0" visible="false"></a-box>
            </a-entity>

            <!-- TRẠM 3: P2O5 -->
            <a-entity position="1.5 0 0">
                <a-text value="P2O5" position="0 1.8 0" align="center" color="#333" width="4"></a-text>
                
                <a-entity id="flask-3">
                    <a-cone color="#fff" opacity="0.3" radius-bottom="0.5" radius-top="0.1" height="0.8" position="0 0.4 0"></a-cone>
                    <a-cylinder color="#fff" opacity="0.3" radius="0.1" height="0.3" position="0 0.9 0"></a-cylinder>
                    <a-cone id="liquid-3" color="#aaddff" opacity="0.6" radius-bottom="0.48" radius-top="0.2" height="0.5" position="0 0.25 0"></a-cone>
                </a-entity>

                <a-entity id="spoon-3" position="0.5 2 0" rotation="0 0 -30" visible="false">
                    <a-cylinder color="#ddd" opacity="0.5" radius="0.02" height="1" position="0 0 0"></a-cylinder>
                    <a-sphere id="powder-3" color="#ffffff" radius="0.08" position="0 -0.5 0"></a-sphere>
                </a-entity>

                <a-box id="litmus-3" color="#800080" width="0.15" height="0.6" depth="0.01" position="0 1.5 0" visible="false"></a-box>
            </a-entity>

        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const statusText = document.getElementById('status-text');
        const btnAdd = document.getElementById('btn-add');
        const btnTest = document.getElementById('btn-test');

        function stepAddChemicals() {
            btnAdd.disabled = true;
            statusText.innerText = "Đang thêm hóa chất vào nước...";

            for(let i=1; i<=3; i++) {
                const spoon = document.getElementById(`spoon-${i}`);
                const powder = document.getElementById(`powder-${i}`);
                const liquid = document.getElementById(`liquid-${i}`);

                spoon.setAttribute('visible', 'true');
                
                // Animation múc đổ
                spoon.setAttribute('animation', `property: position; from: 0.5 2 0; to: 0 1.2 0; dur: 1500; easing: easeInOutQuad`);
                
                setTimeout(() => {
                    // Hóa chất rơi xuống
                    powder.setAttribute('animation', `property: position; to: 0 -1 0; dur: 800; easing: easeInQuad`);
                    setTimeout(() => { 
                        powder.setAttribute('visible', 'false'); 
                        // Hiệu ứng nước đổi nhẹ màu khi hòa tan (đục hơn)
                        liquid.setAttribute('color', '#e0f4ff');
                    }, 800);
                }, 1500);

                // Thu thìa về
                setTimeout(() => {
                    spoon.setAttribute('animation', `property: position; to: 1 3 0; dur: 1000`);
                }, 3000);
            }

            setTimeout(() => {
                statusText.innerText = "Hòa tan hoàn tất. Hãy nhúng quỳ tím!";
                btnTest.disabled = false;
            }, 4500);
        }

        function stepTestLitmus() {
            btnTest.disabled = true;
            statusText.innerText = "Đang kiểm tra độ pH bằng quỳ tím...";

            for(let i=1; i<=3; i++) {
                const litmus = document.getElementById(`litmus-${i}`);
                litmus.setAttribute('visible', 'true');

                // Hạ xuống
                litmus.setAttribute('animation', `property: position; to: 0 0.4 0; dur: 1500; easing: easeInOutQuad`);

                // Đổi màu và nâng lên
                setTimeout(() => {
                    let newColor = "#800080";
                    if(i === 1) newColor = "#0000FF"; // Na2O -> NaOH (Xanh)
                    if(i === 2) newColor = "#5555FF"; // MgO -> Mg(OH)2 (Xanh nhạt)
                    if(i === 3) newColor = "#FF0000"; // P2O5 -> H3PO4 (Đỏ)
                    
                    litmus.setAttribute('color', newColor);
                    
                    litmus.setAttribute('animation', `property: position; to: 0 1.3 0; dur: 1500; easing: easeInOutQuad`);
                }, 2000);
            }

            setTimeout(() => {
                statusText.innerText = "Kết quả: Na2O, MgO tạo Bazơ (Xanh). P2O5 tạo Axit (Đỏ).";
            }, 4000);
        }

        function resetExperiment() {
            location.reload();
        }
    </script>
</body>
</html>
